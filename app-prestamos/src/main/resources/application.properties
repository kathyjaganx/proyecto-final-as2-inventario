spring.application.name=app-prestamos
server.port=8080

# Webhook del WF1 de n8n (se puede cambiar con la variable de entorno N8N_WEBHOOK_URL)
n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/prestamos}

# Clave X-API-Key: SOLO se lee de la variable de entorno N8N_API_KEY, nunca se escribe aquí
n8n.api-key=${N8N_API_KEY:}

# Tiempo máximo de espera de la respuesta de n8n
n8n.timeout-segundos=10